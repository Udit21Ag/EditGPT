[project]
name = "editgpt-spike"
version = "0.0.0"
description = "Phase 0 feasibility spike: can EditGPT's local models live inside 8 GB?"
requires-python = ">=3.12"
dependencies = [
    "onnxruntime>=1.20",
    "numpy>=2.0",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "huggingface-hub>=0.26",
    "psutil>=6.0",
    "rich>=13.9",
]

[project.optional-dependencies]
# Installed only at step P0.4 — torch is ~1.2 GB on disk, so we defer it.
torch = [
    "torch>=2.5",
    "transformers>=4.45",
]
# Installed only at step P0.5.
remote = [
    "google-genai>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[tool.ruff]
line-length = 100
