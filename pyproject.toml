[project]
name = "editgpt"
version = "0.1.0"
description = "Agentic prompt-driven image editing"
requires-python = ">=3.12"
dependencies = [
    # Extras are named explicitly: `uv sync --all-extras` applies to this project's own
    # extras, not to a workspace member's, so `editgpt-models` alone leaves out CLIPSeg.
    "editgpt-core[metrics]",
    "editgpt-models",
    "editgpt-planner",
    "editgpt-providers",
    "editgpt-store[s3]",
    "editgpt-gateway[clerk]",
    "editgpt-mcp",
    "editgpt-worker",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# `editgpt-models[text]` is here rather than in the default dependencies because CLIPSeg
# is the *replaced* grounding path (ADR-0002) and the only thing left in this repository
# that needs torch. It is still built and still measured — `make bench-grounding-clipseg`
# is where ADR-0002's numbers come from, and `evals/run.py` falls back to it — but nothing
# on the shipping path loads it, and torch is 502 MB of the 1.4 GB environment. Declaring
# it where it is actually used is what keeps a worker image from carrying it.
bench = ["editgpt-models[text]", "datasets>=3.0", "scikit-image>=0.24"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-socket>=0.7",
    "hypothesis>=6.112",
    "respx>=0.21",
    "mypy>=1.13",
    "ruff>=0.8",
    "psutil>=6.0",
    "types-psutil>=6.0",
]
load = [
    "locust>=2.31",
]
mcp = [
    # 2.x: `FastMCP` is `MCPServer` there, which is what `apps/mcp` is written against.
    "mcp>=2.0",
]

[tool.uv.workspace]
members = ["packages/*", "apps/gateway", "apps/mcp", "apps/worker"]

[tool.uv.sources]
editgpt-core = { workspace = true }
editgpt-models = { workspace = true }
editgpt-planner = { workspace = true }
editgpt-providers = { workspace = true }
editgpt-store = { workspace = true }
editgpt-gateway = { workspace = true }
editgpt-mcp = { workspace = true }
editgpt-worker = { workspace = true }

# ---------------------------------------------------------------- lint / format
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF", "PERF", "ARG"]
ignore = [
    "B008",    # FastAPI's Depends() in defaults is the documented idiom
    "PT011",   # pytest.raises(ValueError) without match= is fine for our own errors
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ARG001", "ARG002"]   # fixtures arrive as unused-looking args

# ---------------------------------------------------------------- types
[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["spike/", "build/"]
plugins = []

# Each package owns a `tests/` directory, so `conftest.py` and a name like `test_jobs.py`
# occur more than once. pytest resolves that with `--import-mode=importlib`; mypy needs
# to be told the same thing a different way. Listing the src roots keeps a package module
# named `editgpt_core.spec` rather than `packages.core.src.editgpt_core.spec`, while a
# test file falls back to a path-derived name and stops colliding.
explicit_package_bases = true
mypy_path = """packages/core/src:packages/models/src:packages/planner/src:\
packages/providers/src:packages/store/src:apps/gateway/src:apps/mcp/src:apps/worker/src"""

[[tool.mypy.overrides]]
# Vision and runtime libraries either ship no stubs or ship stale ones. We type our own
# boundaries instead: every function that takes or returns an image annotates the array
# type, and results crossing back from these libraries go through `np.asarray`.
module = [
    "onnxruntime.*",
    "huggingface_hub.*",
    "transformers.*",
    "torch.*",
    "psutil.*",
    "tokenizers.*",
    "celery.*",
    "boto3.*",
    "botocore.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# OpenCV bundles stubs written against numpy 1.x shape typing. Under numpy 2 they
# reject `npt.NDArray[np.uint8]` at every call site — false positives that would push
# us toward weakening our own annotations to satisfy theirs.
module = ["cv2.*"]
ignore_missing_imports = true
follow_imports = "skip"

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages", "apps", "evals", "benchmarks", "tests"]
addopts = [
    # Each package owns a `tests/` directory; importlib mode keeps their module names
    # from colliding without forcing unique-but-meaningless file names.
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--disable-socket",          # no test may reach the network by accident
    "--allow-unix-socket",
]
markers = [
    "live: hits a real network provider; excluded from `make check`, run nightly",
    "slow: takes more than a few seconds",
    "memory: asserts peak RSS; runs in its own process",
    # Included in `make check`: these skip themselves when the service is not up, so a
    # checkout with no containers still runs green, and CI supplies one so they really run.
    "service: needs a live backing service (Postgres, MinIO); skips cleanly without one",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
# `apps` is in here as well as `packages`: the gateway and the worker are where the
# input boundary and the job lifecycle live, and leaving them out of the gate meant the
# most security-sensitive code in the repository counted for nothing.
source = ["packages", "apps"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
