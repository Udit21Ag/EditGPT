[project]
name = "editgpt-gateway"
version = "0.1.0"
description = "HTTP gateway: upload, job intake, progress streaming"
requires-python = ">=3.12"
dependencies = [
    "editgpt-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editgpt_gateway"]
