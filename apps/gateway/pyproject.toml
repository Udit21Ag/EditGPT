[project]
name = "editgpt-gateway"
version = "0.1.0"
description = "HTTP gateway: upload, job intake, progress streaming"
requires-python = ">=3.12"
dependencies = [
    "editgpt-core",
    # The planner is contracts and regexes with one HTTP call behind it — no imaging
    # stack, no models. Architectural invariant 3 forbids the *worker's* dependencies
    # here; this is not one of them.
    "editgpt-planner",
    "editgpt-store",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    # Pillow is here to *reject* images, not to edit them: dimensions are read from the
    # header before decoding, which is the only defence against a decompression bomb.
    "pillow>=10.4",
    "redis>=5.2",
    "celery>=5.4",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]
# Session verification. Optional because the gateway runs without authentication when no
# Clerk keys are configured, and `make check` must not need a credential.
clerk = ["clerk-backend-api>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editgpt_gateway"]
