[project]
name = "editgpt-worker"
version = "0.1.0"
description = "Celery worker running EditGPT jobs"
requires-python = ">=3.12"
dependencies = [
    "editgpt-core",
    "editgpt-store",
    "celery>=5.4",
    "redis>=5.2",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editgpt_worker"]
