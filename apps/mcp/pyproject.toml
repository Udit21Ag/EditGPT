[project]
name = "editgpt-mcp"
version = "0.1.0"
description = "EditGPT's vision capability as MCP tools, over the gateway's own API"
requires-python = ">=3.12"
dependencies = [
    "editgpt-core",
    "mcp>=2.0",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editgpt_mcp"]
