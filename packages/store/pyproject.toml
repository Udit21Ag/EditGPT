[project]
name = "editgpt-store"
version = "0.1.0"
description = "Persistence for EditGPT: content-addressed assets, jobs, artifacts and the cost ledger"
requires-python = ">=3.12"
dependencies = [
    "editgpt-core",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# Any S3-compatible object store. Optional because the local adapter is the default and
# `make check` must not depend on a credential or a network.
s3 = ["boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editgpt_store"]
