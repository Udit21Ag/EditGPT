# Alembic configuration for the EditGPT schema.
#
# `script_location` is relative to this file, and `sqlalchemy.url` is deliberately empty:
# the URL comes from EDITGPT_DATABASE_URL at runtime so a credential never sits in a file
# that gets committed. See migrations/env.py.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
# Required from Alembic 1.16: without it the path above is split on spaces, commas *and*
# colons, which mangles any absolute path and warns on every run.
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
