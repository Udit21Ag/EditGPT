[project]
name = "editgpt-models"
version = "0.1.0"
description = "Local model execution for EditGPT: segmentation, erasure, and the routing between them"
requires-python = ">=3.12"
dependencies = [
    "editgpt-core[metrics]",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "numpy>=2.0",
    "psutil>=6.0",
    "huggingface-hub>=0.26",
]

[project.optional-dependencies]
# CLIPSeg is the one model still on torch. Exporting it to ONNX int8 is the single
# largest memory saving available (1188 MB of RSS for a 150 MB model) and is the first
# task of Phase 4, at which point this extra disappears.
text = ["torch>=2.5", "transformers>=4.45"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editgpt_models"]
