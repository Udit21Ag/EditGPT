[project]
name = "editgpt-planner"
version = "0.1.0"
description = "Turning an instruction into a typed plan, with the model used as little as possible"
requires-python = ">=3.12"
dependencies = [
    "editgpt-core",
    # The one call this package makes. `httpx` is already in the tree for the provider
    # adapter; a vendor SDK would be a second HTTP client and a second way to be wrong.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editgpt_planner"]
