[project]
name = "editgpt-providers"
version = "0.1.0"
description = "Remote model providers with failover, quota tracking and a circuit breaker"
requires-python = ">=3.12"
dependencies = ["editgpt-core", "httpx>=0.27", "numpy>=2.0", "pillow>=10.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editgpt_providers"]
