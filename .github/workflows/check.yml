name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No test may reach the network; pytest enforces it, this makes a violation obvious.
  EDITGPT_ENVIRONMENT: ci

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The migration is the one thing SQLite cannot verify. It was generated against
    # SQLite, reviewed, merged, and failed on its first real run — Postgres rejected an
    # untyped bind for a `uuid` column. `packages/store/tests/test_migrations.py` applies
    # and rolls it back against this service; without it those tests skip and the schema
    # goes unverified again.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: editgpt
          POSTGRES_PASSWORD: editgpt
          POSTGRES_DB: editgpt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U editgpt"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install 3.12
      - run: uv sync --all-extras --frozen

      # MinIO comes from the compose file rather than a second definition here, so the
      # thing CI exercises is the thing a developer runs. It is started as a step and not
      # as a service container because it needs a `command`, which service containers
      # cannot express.
      - name: Start object storage
        run: |
          docker compose --profile s3 up -d minio
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break || sleep 2
          done

      # Each step calls the Makefile rather than repeating its command. `AGENTS.md`
      # promises `make check` runs exactly what CI runs; spelling the commands out twice
      # made that a claim rather than a fact, and they had already drifted — CI was
      # linting three directories where the Makefile linted six.
      - name: Lint
        run: make lint

      - name: Types
        run: make types

      - name: Harness integrity
        run: make harness

      - name: Tests
        run: make test COV_ARGS="--cov-report=xml --cov-report=term-missing"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @editgpt/web lint
      - run: pnpm --filter @editgpt/web typecheck
      - run: pnpm --filter @editgpt/web test
      - run: pnpm format:check
      - run: pnpm --filter @editgpt/web build

  commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Conventional Commits
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
