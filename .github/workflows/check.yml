name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No test may reach the network; pytest enforces it, this makes a violation obvious.
  EDITGPT_ENVIRONMENT: ci

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The migration is the one thing SQLite cannot verify. It was generated against
    # SQLite, reviewed, merged, and failed on its first real run — Postgres rejected an
    # untyped bind for a `uuid` column. `packages/store/tests/test_migrations.py` applies
    # and rolls it back against this service; without it those tests skip and the schema
    # goes unverified again.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: editgpt
          POSTGRES_PASSWORD: editgpt
          POSTGRES_DB: editgpt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U editgpt"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install 3.12
      - run: uv sync --all-extras --frozen

      # MinIO comes from the compose file rather than a second definition here, so the
      # thing CI exercises is the thing a developer runs. It is started as a step and not
      # as a service container because it needs a `command`, which service containers
      # cannot express.
      - name: Start object storage
        run: |
          docker compose --profile s3 up -d minio
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break || sleep 2
          done

      # Each step calls the Makefile rather than repeating its command. `AGENTS.md`
      # promises `make check` runs exactly what CI runs; spelling the commands out twice
      # made that a claim rather than a fact, and they had already drifted — CI was
      # linting three directories where the Makefile linted six.
      - name: Lint
        run: make lint

      - name: Types
        run: make types

      - name: Harness integrity
        run: make harness

      - name: Tests
        run: make test COV_ARGS="--cov-report=xml --cov-report=term-missing"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  # TD-007. `make eval` produced a table nobody diffed, which is how a black
  # safety-filter frame, a swallowed shoe and a smeared hand all reached a human rather
  # than a check. The generative cases are excluded: they spend a daily free-tier
  # allowance shared with development, and burning it per push would make the golden set
  # unrunnable — the state this was meant to escape, not enter.
  #
  # Runs on pushes as well as pull requests, because this repository is worked by pushing
  # to `main` — there are no merge commits in its history. Gated on pull requests, as it
  # first shipped, this job would simply never have run, which is the same nothing it was
  # written to replace. On a push there is no pull request to comment on, so the diff goes
  # to the run's job summary and the images to an artifact either way.
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install 3.12
      - run: uv sync --all-extras --frozen

      # ~550 MB of ONNX weights. Keyed on the registry so a change to a model URL or
      # checksum fetches fresh rather than serving a stale file under a new name.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/editgpt/models
          key: models-${{ hashFiles('packages/models/src/editgpt_models/registry.py') }}

      - name: Golden set (local operations only)
        run: make eval-local

      - name: Diff against the baseline
        id: diff
        run: |
          {
            echo 'report<<GOLDEN'
            make eval-diff || echo "__BLOCKING__"
            echo GOLDEN
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-images
          path: evals/out

      # The images are the arbiter, so both write-ups exist to say which ones to open.
      - name: Write the diff to the run summary
        if: always()
        env:
          REPORT: ${{ steps.diff.outputs.report }}
        run: |
          {
            echo "### Golden set"
            echo
            echo "$REPORT"
            echo
            echo "Images are attached to this run as \`eval-images\`."
            echo "Cost is a proxy this project has measured as unreliable (TD-017) —"
            echo "open the picture before trusting the number."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const body = `### Golden set\n\n${{ toJSON(steps.diff.outputs.report) }}\n\n`
              + `Images are attached to this run as \`eval-images\`. `
              + `Cost is a proxy this project has measured as unreliable (TD-017) — `
              + `open the picture before trusting the number.`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('### Golden set'));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      # Through the environment rather than `${{ }}` in the script: the report is
      # multi-line, and expanding it inline would both break the shell and hand any
      # future report text a way into it.
      - name: Fail on a blocking change
        env:
          REPORT: ${{ steps.diff.outputs.report }}
        run: |
          case "$REPORT" in
            *__BLOCKING__*) echo "blocking quality change; see the comment above"; exit 1 ;;
          esac

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The browser tier in `vitest.workspace.ts` runs the canvas code in a real Chromium,
      # because jsdom has no 2-D context and the picker's drawing had never executed
      # anywhere. `--with-deps` because the GitHub runner lacks the shared libraries.
      - run: pnpm --filter @editgpt/web exec playwright install --with-deps chromium

      - run: pnpm --filter @editgpt/web lint
      - run: pnpm --filter @editgpt/web typecheck
      - run: pnpm --filter @editgpt/web test
      - run: pnpm format:check
      - run: pnpm --filter @editgpt/web build

  # The browser half of the stack, end to end. Separate from `web` because it needs a
  # gateway and a database, and separate from `eval` because it needs neither the models
  # nor the free-tier provider allowance: the smoke specs assert that the site builds,
  # renders, and is refused without a session, which is what the `web` job cannot see.
  #
  # The signed-in flows skip unless CLERK_E2E_EMAIL and CLERK_E2E_PASSWORD are set as
  # repository secrets, exactly as the `service`-marked Python tests skip without Postgres.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: editgpt
          POSTGRES_PASSWORD: editgpt
          POSTGRES_DB: editgpt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U editgpt"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_E2E_EMAIL: ${{ secrets.CLERK_E2E_EMAIL }}
      CLERK_E2E_PASSWORD: ${{ secrets.CLERK_E2E_PASSWORD }}
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install 3.12
      - run: uv sync --all-extras --frozen

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @editgpt/web exec playwright install --with-deps chromium

      - name: Start the gateway
        run: |
          uv run uvicorn editgpt_gateway.app:app --port 8000 &
          for _ in $(seq 1 40); do
            curl -sf http://localhost:8000/health >/dev/null && exit 0
            sleep 2
          done
          echo "the gateway never became healthy"; exit 1

      - name: Browser flows
        run: make e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Conventional Commits
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
